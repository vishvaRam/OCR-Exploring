services:
  ocr:
    container_name: ocr
    build: .
    dns:
      - 8.8.8.8
      - 8.8.4.4
    network_mode: host
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Critical for performance
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
   
    # Environment optimizations
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # GPU resource allocation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
